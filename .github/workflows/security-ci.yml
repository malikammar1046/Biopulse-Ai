name: Security & Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-and-hygiene-scan:
    name: Secrets & Repository Hygiene Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Tracked Secret Files (.env, sqlite, keys)
        run: |
          echo "Scanning repository for prohibited tracked files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.env($|\.local$|\.production$|\.development$)|\.sqlite3$|\.sqlite3-journal$|\.pem$|\.key$|\.cert$)' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Prohibited files are tracked by Git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          else
            echo "✓ No tracked secret or local state files found."
          fi

      - name: Verify No Tracked Virtual Environments or Dependencies
        run: |
          echo "Scanning for tracked node_modules or venv directories..."
          FORBIDDEN_DIRS=$(git ls-files | grep -E '(^|/)(node_modules|venv|\.venv)/' || true)
          if [ -n "$FORBIDDEN_DIRS" ]; then
            echo "::error::Dependencies or virtual environments are tracked in Git:"
            echo "$FORBIDDEN_DIRS"
            exit 1
          else
            echo "✓ No tracked node_modules or virtual environments found."
          fi

      - name: Lightweight Pattern Scan for Hardcoded Secrets
        run: |
          echo "Scanning for potential hardcoded secret patterns..."
          # Exclude .github/workflows, test files, and .env.example from strict regex
          SUSPICIOUS=$(git grep -EI '(eyJhbGciOi[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{20,})' -- ':(exclude).env.example' ':(exclude).github/workflows/*' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "::error::Potential hardcoded credentials detected:"
            echo "$SUSPICIOUS"
            exit 1
          else
            echo "✓ No overt secret signatures found."
          fi
