# ==============================================================================
# BioPulse AI - Azure Static Web Apps CI/CD Workflow
# Repository: MHamzaAhmed-dev/biopulse-ai-risk-assessment
# Branch: ammar-latest-work
# Target: Azure for Students (Static Web Apps Free Tier)
# ==============================================================================
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - ammar-latest-work
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - ammar-latest-work

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy BioPulse Web App
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build And Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Azure Static Web App Configuration ######
          app_location: "apps/web"        # App source code path
          api_location: ""                # Backend is hosted separately on Azure Container Apps
          output_location: "dist"         # Built frontend bundle output path
          app_build_command: "npm run build"
        env:
          ###### Environment Variables at Build Time (from GitHub Actions variables) ######
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL || secrets.VITE_BACKEND_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
