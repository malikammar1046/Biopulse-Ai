name: PMOSense CI

on:
  push:
    branches: [ main, master, develop, hamza ]
  pull_request:
    branches: [ main, master, develop, hamza ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend (Django & DRF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: "ci-dummy-secret-key-not-for-production-use"
      DJANGO_DEBUG: "True"
      SUPABASE_URL: "https://dummy-project.supabase.co"
      SUPABASE_ANON_KEY: "dummy-anon-key"
      ALLOW_LOCAL_SQLITE_FALLBACK: "true"
      DISABLE_INTELLIGENCE_PREWARM: "true"
      DISABLE_SUPABASE_NETWORK: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install Dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install --no-cache-dir -r requirements.txt
          
      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check
          
      - name: Verify Migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          
      - name: Run Backend Tests
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          DJANGO_SETTINGS_MODULE: "settings.test"
        run: |
          cd backend
          python manage.py test --no-parallel --keepdb --verbosity=2

  ml-checks:
    name: AI/ML & OCR Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install System OCR Library
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr
          
      - name: Install ML Dependencies
        working-directory: machine-learning/ml
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision torchaudio
          pip install --no-cache-dir -r requirements.txt
          
      - name: Run Legacy ML Stack Validation Tests
        run: |
          cd machine-learning/ml
          pytest test_imports.py -v

      - name: Validate Production Models (PCOS-ML & male-ML)
        run: |
          python -m pytest machine-learning/test_production_models.py -v

  web-checks:
    name: Web Dashboard (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          
      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          
      - name: TypeScript Type Check
        run: |
          cd apps/web
          npm run type-check
          
      - name: Production Build
        run: |
          cd apps/web
          npm run build

  mobile-checks:
    name: Mobile App (Expo & React Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: |
          cd apps/mobile
          npm install --legacy-peer-deps
          
      - name: TypeScript Type Check
        run: |
          cd apps/mobile
          npx tsc --noEmit
          
      - name: Verify Expo Config
        run: |
          cd apps/mobile
          npx expo config
