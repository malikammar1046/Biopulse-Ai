name: Backend CI

on:
  push:
    branches: [ main, develop, hamza ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop, hamza ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-validate-and-test:
    name: Django Checks & Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: "ci-dummy-secret-key-not-for-production-use"
      DJANGO_DEBUG: "True"
      SUPABASE_URL: "https://dummy-project.supabase.co"
      SUPABASE_ANON_KEY: "dummy-anon-key"
      ALLOW_LOCAL_SQLITE_FALLBACK: "true"
      DISABLE_INTELLIGENCE_PREWARM: "true"
      DISABLE_SUPABASE_NETWORK: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install System Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 tesseract-ocr

      - name: Install Dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install --no-cache-dir -r requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Verify Migrations Integrity
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        env:
          PYTHONUNBUFFERED: "1"
          DJANGO_SETTINGS_MODULE: "settings.test"
        run: |
          cd backend
          python manage.py test
