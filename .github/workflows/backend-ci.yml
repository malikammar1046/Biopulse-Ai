name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-validate-and-test:
    name: Django Checks & Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: "ci-dummy-secret-key-not-for-production-use"
      DJANGO_DEBUG: "True"
      SUPABASE_URL: "https://dummy-project.supabase.co"
      SUPABASE_ANON_KEY: "dummy-anon-key"
      ALLOW_LOCAL_SQLITE_FALLBACK: "true"
      DISABLE_INTELLIGENCE_PREWARM: "true"
      DISABLE_SUPABASE_NETWORK: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Verify Migrations Integrity
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        run: |
          cd backend
          python manage.py test
