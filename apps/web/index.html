<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <title>BIOPulse AI | Unified Reproductive Health Screening & Risk Assessment Platform</title>
    <meta
      name="description"
      content="BIOPulse AI is a unified reproductive-health screening and risk-assessment platform designed for Women's Health (PCOS), Men's Health (Male Hypogonadism), and baseline health monitoring."
    />
    <meta name="theme-color" content="#0891B2" />

    <!-- Google Fonts: Plus Jakarta Sans, Outfit & Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#162A45] antialiased selection:bg-[#0891B2] selection:text-white font-sans min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; background-color: #F8FAFC; color: #162A45; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; position: relative; overflow: hidden; margin: 0; box-sizing: border-box; user-select: none;">
        <style>
          @keyframes bpPulseGlow { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.03); opacity: 1; } }
        </style>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 380px; margin: 0 auto; padding: 24px;">
          <!-- BioPulse Heart Emblem -->
          <div style="margin-bottom: 16px;">
            <div style="padding: 14px; border-radius: 24px; background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.9); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04); display: flex; align-items: center; justify-content: center; animation: bpPulseGlow 2s infinite ease-in-out;">
              <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="bp-heart-grad-pre" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#38BDF8" />
                    <stop offset="45%" stop-color="#0284C7" />
                    <stop offset="100%" stop-color="#0D9488" />
                  </linearGradient>
                </defs>
                <path d="M50 88C48 86 14 62 14 36C14 20 26 10 40 10C46 10 50 14 50 14C50 14 54 10 60 10C74 10 86 20 86 36C86 62 52 86 50 88Z" fill="url(#bp-heart-grad-pre)" />
                <path d="M50 78C48 76 22 56 22 36C22 24 30 18 39 18C44 18 48 21 50 21C52 21 56 18 61 18C70 18 78 24 78 36C78 56 52 76 50 78Z" fill="white" fill-opacity="0.18" />
                <path d="M20 48H36L42 34L50 62L58 40L64 52H80" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>
          <!-- Brand Typography -->
          <h1 style="font-size: 26px; font-weight: 900; color: #0B1E38; letter-spacing: -0.02em; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; margin: 0; line-height: 1.2;">
            BioPulse <span style="color: #0891B2;">AI</span>
          </h1>
          <p style="font-size: 13px; color: #64748B; font-weight: 500; font-family: 'Plus Jakarta Sans', sans-serif; margin: 6px 0 0 0;">
            Personalized reproductive health intelligence
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
