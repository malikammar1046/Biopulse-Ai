<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="m2-bg" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F2FBFA" />
      <stop offset="100%" stop-color="#DDF7F7" />
    </radialGradient>
    <linearGradient id="m2-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="m2-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9EAA" />
      <stop offset="100%" stop-color="#075E66" />
    </linearGradient>
    <filter id="m2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E9EAA" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#m2-bg)" stroke="#B2EBF2" stroke-width="2" />

  <!-- Body / Shoulders -->
  <g filter="url(#m2-shadow)">
    <!-- Base Crewneck Sweater -->
    <path d="M26 104 C26 88 40 82 60 82 C80 82 94 88 94 104 L94 116 L26 116 Z" fill="url(#m2-shirt)" />
    <!-- Crewneck Collar Ring -->
    <path d="M48 83 C54 88 66 88 72 83 C70 87 64 91 60 91 C56 91 50 87 48 83 Z" fill="#EAFBFC" />
    <!-- Neck -->
    <path d="M52 70 L52 86 C54 88 66 88 68 86 L68 70 Z" fill="#E8B896" />
    <path d="M52 74 C56 78 64 78 68 74 L68 78 C64 82 56 82 52 78 Z" fill="#D39871" opacity="0.35" />
  </g>

  <!-- Head & Ears -->
  <g id="m2-head">
    <!-- Left Ear -->
    <circle cx="36" cy="57" r="6" fill="#E8B896" />
    <circle cx="36" cy="57" r="3.5" fill="#D39871" opacity="0.5" />
    <!-- Right Ear -->
    <circle cx="84" cy="57" r="6" fill="#E8B896" />
    <circle cx="84" cy="57" r="3.5" fill="#D39871" opacity="0.5" />

    <!-- Face Oval -->
    <path d="M38 52 C38 34 82 34 82 52 C82 69 73 78 60 78 C47 78 38 69 38 52 Z" fill="#F0C3A2" />

    <!-- Cheeks (Blush) -->
    <circle cx="45" cy="62" r="4.5" fill="#E87F6E" opacity="0.28" />
    <circle cx="75" cy="62" r="4.5" fill="#E87F6E" opacity="0.28" />

    <!-- Eyebrows -->
    <path d="M44 44 C48 42 52 43 55 45" stroke="#1A202C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M65 45 C68 43 72 42 76 44" stroke="#1A202C" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Eyes (Bright, Kind & Enthusiastic) -->
    <circle cx="49" cy="51" r="3.5" fill="#1A202C" />
    <circle cx="50.2" cy="49.8" r="1.2" fill="#FFFFFF" />
    <circle cx="71" cy="51" r="3.5" fill="#1A202C" />
    <circle cx="72.2" cy="49.8" r="1.2" fill="#FFFFFF" />

    <!-- Gentle Nose -->
    <path d="M59 53 C60 56 61 56 62 56" stroke="#C2845B" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Wide Warm Innocent Smile -->
    <path d="M51 63 C55 69 65 69 69 63" stroke="#8C3A3A" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Hair (Textured Modern Crop) -->
  <path d="M35 48 C33 33 42 22 60 22 C78 22 86 32 85 47 C83 45 80 43 77 42 C74 38 69 37 64 38 C59 36 53 37 49 40 C44 40 39 44 35 48 Z" fill="url(#m2-hair)" />
  <!-- Hair Texture Tuft Accents -->
  <path d="M54 22 C56 19 62 19 64 23" stroke="#2D3748" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M46 25 C48 22 52 23 54 26" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
