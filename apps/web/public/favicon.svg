<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="ovaBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D0C4E" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#140624" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#090212" stop-opacity="1"/>
    </radialGradient>

    <!-- Primary Loop Gradient (Orchid to Magenta) -->
    <linearGradient id="ovaGrad1" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8E3EAF"/>
      <stop offset="50%" stop-color="#A21CAF"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <!-- Secondary Loop Gradient (Berry to Warm Coral) -->
    <linearGradient id="ovaGrad2" x1="85%" y1="10%" x2="15%" y2="90%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E87084"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Core Nucleus Radial Glow -->
    <radialGradient id="nucleusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDA4AF"/>
      <stop offset="70%" stop-color="#FB7185" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8E3EAF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container for Favicon / Icon crispness -->
  <rect width="120" height="120" rx="30" fill="url(#ovaBgGlow)"/>
  <rect width="118" height="118" x="1" y="1" rx="29" stroke="rgba(216, 180, 254, 0.2)" stroke-width="1.5"/>

  <!-- Left Intertwined Ovarian Petal Loop -->
  <path
    d="M 60 22 C 38 22, 24 38, 24 60 C 24 82, 38 98, 60 98 C 76 98, 86 88, 88 74 C 89 66, 82 60, 75 60 C 67 60, 62 67, 56 78 C 50 88, 40 85, 36 78 C 32 70, 32 50, 36 42 C 40 35, 50 32, 56 42 C 62 53, 67 60, 75 60 C 82 60, 89 54, 88 46 C 86 32, 76 22, 60 22 Z"
    fill="url(#ovaGrad1)"
    opacity="0.95"
  />

  <!-- Right Intertwined Vitality / Follicle Loop -->
  <path
    d="M 60 22 C 76 22, 96 36, 96 60 C 96 84, 76 98, 60 98 C 44 98, 34 88, 32 74 C 31 66, 38 60, 45 60 C 53 60, 58 67, 64 78 C 70 88, 80 85, 84 78 C 88 70, 88 50, 84 42 C 80 35, 70 32, 64 42 C 58 53, 53 60, 45 60 C 38 60, 31 54, 32 46 C 34 32, 44 22, 60 22 Z"
    fill="url(#ovaGrad2)"
    opacity="0.9"
    style="mix-blend-mode: screen;"
  />

  <!-- Central Luminous Follicle Nucleus / Vitality Spark -->
  <circle cx="60" cy="60" r="14" fill="url(#nucleusGlow)" filter="url(#softGlow)"/>
  <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>

  <!-- Orbital Cycle Indicator Sparkles -->
  <circle cx="60" cy="22" r="3" fill="#FB7185"/>
  <circle cx="60" cy="22" r="1.5" fill="#FFFFFF"/>
  
  <circle cx="60" cy="98" r="3" fill="#C084FC"/>
  <circle cx="60" cy="98" r="1.5" fill="#FFFFFF"/>
</svg>